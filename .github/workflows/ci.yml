name: CI

# Every push and PR is verified. On main, a major version bump in package.json
# deploys to GitHub Pages, but only after verify has passed.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Newer pushes cancel older runs on feature branches; main always runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Coverage summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| | % | covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build

      - run: npm run check:dist

      # Built site for inspection. Netlify deploys are manual and need explicit sign-off.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dip-lab-dist
          path: dist
          retention-days: 14

  # Plays a first trade in Chrome against the built app and checks it works offline.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Kept out of package.json: only this test needs it, and it drives the runner's Chrome.
      - run: npm i --no-save playwright-core@1.59.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dip-lab-dist
          path: dist

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 7

  # Deploys only when the major version goes up (e.g. 0.x -> 1.0.0, 1.x -> 2.0.0).
  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          major() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version.split(".")[0])}catch{console.log(0)}})'; }
          new=$(major < package.json)
          old=$(git show "$BEFORE:package.json" 2>/dev/null | major || echo 0)
          echo "major: $old -> $new"
          if [ "$new" -gt "$old" ]; then deploy=true; else deploy=false; fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  pages:
    needs: [verify, e2e, release-check]
    if: needs.release-check.outputs.deploy == 'true'
    permissions:
      contents: write # release tag
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
