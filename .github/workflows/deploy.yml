name: Deploy to GitHub Pages

# Called by CI after verify and e2e pass on a major version bump on main, or run manually.
# A manual run verifies the code itself before deploying. Each deploy tags a release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # When called from CI these already passed in the verify job.
      - if: github.event_name == 'workflow_dispatch'
        run: npm run typecheck
      - if: github.event_name == 'workflow_dispatch'
        run: npm test

      # Pages serves project sites from /<repo-name>/. For a custom domain or a
      # <user>.github.io repo, change this to '/'.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # The landing page lives next to the app at <base>/welcome/.
      - run: npm run build:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke test
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" sw.js manifest.webmanifest welcome/; do
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL$path" \
              || { echo "::error::$URL$path not reachable"; exit 1; }
          done
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Tags the deployed commit vX.Y.Z and publishes a GitHub Release with generated notes.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Dip Lab $tag" --generate-notes
          echo "### Released $tag" >> "$GITHUB_STEP_SUMMARY"
