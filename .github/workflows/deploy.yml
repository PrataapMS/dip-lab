name: Deploy to GitHub Pages

# Deploys only when the major version in package.json goes up on main
# (e.g. 0.x -> 1.0.0, 1.x -> 2.0.0), or when run manually.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          major() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version.split(".")[0])}catch{console.log(0)}})'; }
          new=$(major < package.json)
          old=$(git show "$BEFORE:package.json" 2>/dev/null | major || echo 0)
          echo "major: $old -> $new"
          if [ "$new" -gt "$old" ]; then deploy=true; else deploy=false; fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build:
    needs: version-check
    if: needs.version-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Pages serves project sites from /<repo-name>/. For a custom domain or a
      # <user>.github.io repo, change this to '/'.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
