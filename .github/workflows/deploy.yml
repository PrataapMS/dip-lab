name: Deploy to GitHub Pages

# Called by CI after verify passes on a major version bump on main, or run manually.
# A manual run verifies the code itself before deploying.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # When called from CI these already passed in the verify job.
      - if: github.event_name == 'workflow_dispatch'
        run: npm run typecheck
      - if: github.event_name == 'workflow_dispatch'
        run: npm test

      # Pages serves project sites from /<repo-name>/. For a custom domain or a
      # <user>.github.io repo, change this to '/'.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" sw.js manifest.webmanifest; do
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL$path" \
              || { echo "::error::$URL$path not reachable"; exit 1; }
          done
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
